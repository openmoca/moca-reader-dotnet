name: Fuzz

# Coverage-guided fuzzing of the open-and-search path with SharpFuzz and libFuzzer (fuzz/README.md). Short on pull
# requests; longer nightly, with the corpus kept between nightly runs. A crash, timeout or out-of-memory fails the
# job and uploads the input.
on:
  pull_request:
    paths: ['src/OpenMoca.Reader/**', 'fuzz/**', 'Directory.Packages.props', '.github/workflows/fuzz.yml']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '600'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Seeds and the files target's base come from the conformance corpus at the ref test.yml uses; move both together.
  MOCA_SPEC_REF: v0.6.0
  # libFuzzer's .NET driver. Its releases publish no checksums, so this is the SHA-256 of the file as first
  # downloaded and checked; a changed file fails the job.
  LIBFUZZER_DOTNET_TAG: v2025.05.02.0904
  LIBFUZZER_DOTNET_SHA256: c2c2a90d94c409a4af339a0d4f244e0442c5a5d249be0f1252ba07871f285958
  SHARPFUZZ_VERSION: 2.3.0

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [open, files]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          path: moca-reader-dotnet
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/moca-spec
          ref: ${{ env.MOCA_SPEC_REF }}
          path: moca-spec
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: moca-reader-dotnet/global.json
      - name: Install libFuzzer's .NET driver and SharpFuzz
        run: |
          curl -fsSL -o libfuzzer-dotnet "https://github.com/Metalnem/libfuzzer-dotnet/releases/download/$LIBFUZZER_DOTNET_TAG/libfuzzer-dotnet-ubuntu"
          echo "$LIBFUZZER_DOTNET_SHA256  libfuzzer-dotnet" | sha256sum -c -
          chmod +x libfuzzer-dotnet
          dotnet tool install --global SharpFuzz.CommandLine --version "$SHARPFUZZ_VERSION"
      - name: Build the harness and instrument the Reader
        working-directory: moca-reader-dotnet/fuzz
        run: |
          dotnet publish OpenMoca.Reader.Fuzz -c Release -o out
          sharpfuzz out/OpenMoca.Reader.dll
          ./out/OpenMoca.Reader.Fuzz seed ../../moca-spec corpus
      - name: Restore the nightly corpus
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: moca-reader-dotnet/fuzz/kept-${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-
      - name: Fuzz
        working-directory: moca-reader-dotnet/fuzz
        env:
          MOCA_SPEC_DIR: ${{ github.workspace }}/moca-spec
          MOCA_FUZZ_TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || github.event_name == 'schedule' && '1800' || inputs.seconds }}
        run: |
          kept="kept-$MOCA_FUZZ_TARGET"; mkdir -p "$kept"
          if [ "$MOCA_FUZZ_TARGET" = open ]; then seeds=corpus; len=1048576; else seeds=corpus-files; len=65536; fi
          # New inputs go to the first corpus folder (kept), seeds are read from the second.
          "$GITHUB_WORKSPACE/libfuzzer-dotnet" --target_path=out/OpenMoca.Reader.Fuzz "$kept" "$seeds" \
            -rss_limit_mb=4096 -max_len=$len -max_total_time="$SECONDS_PER_TARGET"
      - name: Save the nightly corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: moca-reader-dotnet/fuzz/kept-${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: |
            moca-reader-dotnet/fuzz/crash-*
            moca-reader-dotnet/fuzz/timeout-*
            moca-reader-dotnet/fuzz/oom-*
          if-no-files-found: ignore
