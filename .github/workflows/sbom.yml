name: SBOM

# Security baseline: a CycloneDX software bill of materials for each release, attached to the GitHub release.
# On a pull request that changes dependencies, the same document is built and kept as a workflow artifact, so the
# path is proved before release day.
on:
  release:
    types: [published]
  pull_request:
    paths: ['Directory.Packages.props', '**/Directory.Packages.props', '.github/workflows/sbom.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach the document to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: mkdir -p "$RUNNER_TEMP/sbom"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet tool install --global CycloneDX --version 6.3.1
      # One document per published package (src/), so test projects are never in it.
      - run: |
          for p in src/*/*.csproj; do
            dotnet CycloneDX "$p" -o "$RUNNER_TEMP/sbom" -fn "$(basename "$p" .csproj).cdx.json" -F Json
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP"/sbom/*.cdx.json --clobber -R "${{ github.repository }}"
